# =============================================================================
#  Apache Virtual Host / Reverse Proxy for Santa Fe Beach Club
#  Enables the existing vanilla PHP frontend AND the Laravel API on one domain.
# =============================================================================
#
#  Approach: The vanilla PHP frontend is served as the main DocumentRoot.
#  Laravel's /api/* requests are proxied to a separate process (php artisan serve)
#  OR you can use mod_alias / mod_rewrite to point /api into laravel_core/public.
#
# ─── OPTION A: Alias-Based (Recommended for shared XAMPP hosting) ────────────
#  No separate process required.  Add this inside your <VirtualHost> block:

<VirtualHost *:80>
    ServerName santafebeachclub.local
    DocumentRoot "C:/xampp/htdocs/SantaBeachClub-BookingSystem"

    <Directory "C:/xampp/htdocs/SantaBeachClub-BookingSystem">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ── Laravel API Core (Alias into /api) ──────────────────────────
    Alias /api "C:/xampp/htdocs/SantaBeachClub-BookingSystem/laravel_core/public"

    <Directory "C:/xampp/htdocs/SantaBeachClub-BookingSystem/laravel_core/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /api
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.php [L]
        </IfModule>
    </Directory>

    # ── Security Headers ────────────────────────────────────────────
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    ErrorLog  "logs/santafebeachclub-error.log"
    CustomLog "logs/santafebeachclub-access.log" combined
</VirtualHost>

# ─── OPTION B: Reverse Proxy (For dedicated hosting / VPS) ──────────────────
#  Run `php artisan serve --port=8001` as a background service, then proxy:
#
#  <VirtualHost *:80>
#      ServerName santafebeachclub.local
#      DocumentRoot "C:/xampp/htdocs/SantaBeachClub-BookingSystem"
#
#      ProxyPreserveHost On
#      ProxyPass /api http://127.0.0.1:8001/api
#      ProxyPassReverse /api http://127.0.0.1:8001/api
#
#      <Directory "C:/xampp/htdocs/SantaBeachClub-BookingSystem">
#          Options -Indexes +FollowSymLinks
#          AllowOverride All
#          Require all granted
#      </Directory>
#  </VirtualHost>
